# Tests and vets the hook binary sources on every PR and push to main.

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vet
        run: go vet ./cli/

      - name: Test
        run: make test

      - name: Bootstrap script syntax
        run: node --check trustguard/hooks/trustguard-hook.js
